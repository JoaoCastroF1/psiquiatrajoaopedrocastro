    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como funciona a primeira consulta psiquiátrica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A primeira consulta é uma avaliação ampla que dura o tempo necessário para construir uma hipótese diagnóstica fundamentada. Inclui anamnese detalhada, revisão de tratamentos anteriores e análise do contexto de vida. O objetivo é entender o que está acontecendo antes de qualquer prescrição."
          }
        },
        {
          "@type": "Question",
          "name": "O atendimento aceita plano de saúde?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O atendimento é particular. Após cada consulta, é emitida nota fiscal que pode ser utilizada para solicitar reembolso ao plano de saúde, conforme as regras da operadora."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença entre psiquiatra e psicólogo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O psiquiatra é médico, com formação em Medicina e residência em Psiquiatria. Pode prescrever medicamentos, solicitar exames e investigar causas orgânicas dos sintomas. O psicólogo conduz psicoterapia. Em muitos casos, o tratamento mais eficaz combina os dois profissionais trabalhando de forma articulada."
          }
        },
        {
          "@type": "Question",
          "name": "A consulta pode ser feita por telemedicina?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Consultas por telemedicina estão disponíveis para pacientes em acompanhamento ou para primeiras avaliações, quando adequado ao caso clínico. A modalidade segue as normas do CFM."
          }
        },
        {
          "@type": "Question",
          "name": "São realizadas consultas domiciliares?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Consultas domiciliares são disponibilizadas especialmente para pacientes idosos com dificuldade de deslocamento, quadros demenciais avançados ou outras condições que impeçam o comparecimento ao consultório."
          }
        },
        {
          "@type": "Question",
          "name": "Quando procurar um psicogeriatra?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Quando há queixas de memória progressivas, mudança de comportamento no idoso, agitação, apatia, confusão mental ou suspeita de demência. Também quando um idoso apresenta depressão, ansiedade ou psicose com início tardio. A psicogeriatria é a especialidade que leva em conta as particularidades do envelhecimento cerebral e do metabolismo de medicamentos nessa faixa etária."
          }
        },
        {
          "@type": "Question",
          "name": "Como agendar uma consulta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O agendamento pode ser feito pelo WhatsApp (31) 99131-5958 ou pelo formulário de contato no site. O retorno é feito em horário comercial."
          }
        }
      ]
    }
